name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # What the workspace needs on Fedora 44 (the system osreflog targets), toolchain included:
  # Fedora's rust, as COPR builds with.
  BUILD_DEPS: >-
    rust cargo rustfmt clippy gcc clang libbpf-devel kernel-headers
    gtk4-devel libadwaita-devel git-core

jobs:
  rust:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v5
      - run: dnf install -y --setopt=install_weak_deps=False $BUILD_DEPS
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # As COPR's %check runs them: no root, no btrfs, a few processes in sight.
      - run: cargo test --workspace --locked --exclude osreflog-fuzz

  fuzz:
    # Every parser and differ for 30 s each, in parallel, plus vercmp against rpm's own:
    # a smoke test of the hour-long run in scripts/p4/fuzz.sh.
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v5
      - run: dnf install -y --setopt=install_weak_deps=False $BUILD_DEPS python3-rpm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fuzz-${{ hashFiles('Cargo.lock') }}
          restore-keys: fuzz-
      - run: cargo fetch --locked
      - run: scripts/p4/fuzz.sh 30 fuzz-out
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz-out/

  system-files:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v5
      - run: >-
          dnf install -y --setopt=install_weak_deps=False
          systemd libxml2 desktop-file-utils appstream rpm-build rust cargo git-core python3
      # A ratchet: each unit may only get better than its score today (osreflogd 3.6, the boot
      # doctor 4.2: both run as root by design). Lower these as the hardening lands.
      - name: Unit exposure doesn't get worse
        run: |
          systemd-analyze security --offline=yes --threshold=36 data/systemd/osreflogd.service
          systemd-analyze security --offline=yes --threshold=42 data/systemd/osreflog-boot-doctor.service
      - name: D-Bus and polkit policies are well-formed
        run: xmllint --noout data/dbus/*.conf data/polkit/*.policy
      - name: The desktop entry and AppStream metainfo are valid
        run: |
          desktop-file-validate data/app/io.github.khaledsaeed18.osreflog.desktop
          appstreamcli validate --no-net data/app/io.github.khaledsaeed18.osreflog.metainfo.xml
      - name: The spec parses, and its Version and License agree with the workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rpmspec -q --srpm packaging/osreflog.spec
          scripts/dist.sh --check

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
