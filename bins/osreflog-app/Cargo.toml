[package]
name = "osreflog-app"
description = "osreflog for GNOME: your system's history, cause by cause."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "osreflog-app"
path = "src/main.rs"

[dependencies]
osreflog-bisect.workspace = true
osreflog-client.workspace = true
osreflog-model.workspace = true
osreflog-undo.workspace = true
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
tokio.workspace = true

[lints]
workspace = true
