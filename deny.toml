# cargo deny check: run in CI on every push. Advisories, licenses, duplicate versions and where
# crates come from, for everything the workspace builds.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Each one lets the combined work be distributed under GPL-3.0-or-later. The spec's License tag
# is computed from the crates the binaries actually link (scripts/dist.sh --check).
allow = [
    "GPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are GPL-3.0-or-later and never published.
ignore = true

[bans]
# aya, zbus and gtk-rs pull a few crates in two versions; say so, don't fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
