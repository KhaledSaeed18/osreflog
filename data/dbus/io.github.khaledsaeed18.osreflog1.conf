<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- osreflogd owns the name; anyone may call it, and the daemon decides per method
     (root, or polkit: io.github.khaledsaeed18.osreflog.read / .checkpoint / .undo). -->
<busconfig>
  <policy user="root">
    <allow own="io.github.khaledsaeed18.osreflog1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.khaledsaeed18.osreflog1"
           send_interface="io.github.khaledsaeed18.osreflog1"/>
    <allow send_destination="io.github.khaledsaeed18.osreflog1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.khaledsaeed18.osreflog1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="io.github.khaledsaeed18.osreflog1"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
