# How long osreflog keeps checkpoint snapshots. The history (the ledger) is always kept; only
# the snapshots go. Read when osreflogd starts: sudo systemctl restart osreflogd after a change.
# `osreflog status` and `osreflog doctor` say how much space the kept snapshots hold.
#
# Every checkpoint younger than this many hours:
#keep_all_hours = 48
# Then the newest of each day, for this many days:
#daily_days = 14
# Then the newest of each week, for this many weeks:
#weekly_weeks = 8
#
# Pinned checkpoints and the newest one are always kept.
